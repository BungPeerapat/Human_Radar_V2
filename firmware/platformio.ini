[env:esp32-wroom32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    links2004/WebSockets@2.7.3
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV
    -DBOARD_HAS_NO_PSRAM
    ; FW_VERSION is overridden by CI via env: APP_VERSION_NAME -> -DFW_VERSION=...
    ; For local builds (no env), config_manager.h provides the default.
