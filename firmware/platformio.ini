[env:esp32-wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    links2004/WebSockets@^2.4.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV
    -DBOARD_HAS_NO_PSRAM
