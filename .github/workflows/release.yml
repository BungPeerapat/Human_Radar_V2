name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write   # needed to create a Release and push to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          # Derive a monotonic versionCode from the total commit count.
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python (PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32 firmware
        run: |
          pio run -d firmware
          FW_BIN=$(find firmware/.pio/build -name 'firmware.bin' | head -n1)
          if [ -z "$FW_BIN" ]; then
            echo "::warning::No firmware.bin produced — skipping firmware release asset"
            exit 0
          fi
          DEST_FW="firmware-v${{ steps.version.outputs.version_name }}.bin"
          cp "$FW_BIN" "$DEST_FW"
          echo "FIRMWARE_BIN=$DEST_FW" >> "$GITHUB_ENV"
          echo "FIRMWARE_SIZE=$(stat -c %s "$DEST_FW")" >> "$GITHUB_ENV"
          echo "FIRMWARE_SHA256=$(sha256sum "$DEST_FW" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Built firmware: $DEST_FW ($(stat -c %s "$DEST_FW") bytes)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify keystore credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "## Keystore diagnostics"
            echo ""
            echo "- File: \`$KEYSTORE_PATH\` ($(stat -c %s "$KEYSTORE_PATH" 2>/dev/null || echo '?') bytes)"
            echo "- KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
            echo "- KEY_ALIAS: \`$KEY_ALIAS\`"
            echo "- KEY_PASSWORD length: ${#KEY_PASSWORD}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- keytool list (all aliases) ---"
          ALL_ALIASES=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" 2>&1) || ALL_ALIASES="$ALL_ALIASES (FAILED)"
          echo "$ALL_ALIASES"
          {
            echo ""
            echo "### Aliases in keystore"
            echo '```'
            echo "$ALL_ALIASES" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- keytool list with alias '$KEY_ALIAS' ---"
          ALIAS_OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1) || ALIAS_OUT="$ALIAS_OUT (FAILED)"
          echo "$ALIAS_OUT"

          if echo "$ALIAS_OUT" | grep -qi "does not exist"; then
            echo "::error::KEY_ALIAS '$KEY_ALIAS' does not exist in keystore. Use one of the aliases listed above."
            exit 1
          fi
          if echo "$ALIAS_OUT" | grep -qi "password was incorrect"; then
            echo "::error::KEYSTORE_PASSWORD is wrong. Re-enter the secret."
            exit 1
          fi
          if echo "$ALIAS_OUT" | grep -qi "tampered with"; then
            echo "::error::Keystore file invalid or KEYSTORE_PASSWORD wrong."
            exit 1
          fi

      - name: Assemble release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update.json
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Inspect build outputs
        if: always()
        run: |
          echo "--- Tree of app/build/outputs ---"
          find app/build/outputs -maxdepth 6 -type f 2>&1 || true
          echo "--- Tree of app/build (apks only) ---"
          find app/build -name '*.apk' 2>&1 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Locate signed APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          DEST="human-radar-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$DEST")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          # Prefer the annotated tag message (set by tools/release-app.bat).
          # Fall back to the latest commit message for plain `git tag` usage.
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(git log -1 --pretty=%B)
          fi
          # Save raw notes to a file for the release body (preserves newlines)
          printf '%s' "$NOTES" > release_notes.md
          # Save JSON-escaped form for embedding in update.json
          ESCAPED=$(jq -Rs . < release_notes.md)
          {
            echo "notes_json<<NOTES_EOF"
            echo "$ESCAPED"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate update manifest
        run: |
          REPO="${GITHUB_REPOSITORY}"
          TAG="${{ steps.version.outputs.version_name }}"
          APK_NAME="${{ steps.apk.outputs.path }}"
          cat > update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "minSdkVersion": 26,
            "apkUrl": "https://github.com/${REPO}/releases/download/v${TAG}/${APK_NAME}",
            "sha256": "${{ steps.apk.outputs.sha256 }}",
            "sizeBytes": ${{ steps.apk.outputs.size }},
            "mandatory": false,
            "releaseNotes": ${{ steps.notes.outputs.notes_json }},
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: |
            ${{ steps.apk.outputs.path }}
            update.json
            ${{ env.FIRMWARE_BIN }}
          fail_on_unmatched_files: false

      - name: Verify manifest URL
        run: |
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json"
          echo "App should poll: $MANIFEST_URL"
          echo "::notice::Manifest URL = $MANIFEST_URL"
