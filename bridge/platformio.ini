; Bridge firmware — minimal OTA-only build used to escape situations
; where the full firmware's .bin is too big to push reliably over WiFi.
;
; What's in here:
;   - WiFi STA + reconnect (reads creds from NVS "hradar")
;   - PubSubClient MQTT over plain TCP (no WebSocket transport)
;   - cmd handler with ONLY ota_pull and restart
;   - HTTPClient + Update.h for the actual download + flash
;
; What's NOT in here (saves ~600 KB vs the full firmware):
;   - WebSockets library
;   - HTTP WebServer + radar visualization pages
;   - Radar UART driver (LD2450) + parser
;   - Alert pattern player
;   - Detection zones / sensitivity
;   - Power monitor
;   - mDNS advertise
;   - Log buffer / MQTT log forwarding
;
; Settings in NVS namespace "hradar" (WiFi creds, MQTT broker, device
; name, alert config, zones, ...) are preserved across boot — the full
; firmware reads them back when ota_pull lands and the chip reboots.
[env:esp32-wroom32-bridge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ; Aggressive size optimization — bridge has tiny logic, every byte saved
    ; off the binary buys us a higher OTA success rate on noisy WiFi.
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV
    -DBOARD_HAS_NO_PSRAM
    -DBRIDGE_BUILD
    -Os
    -ffunction-sections
    -fdata-sections
build_unflags =
    -Og
    -O0
    -O1
    -O2
    -O3
    -g
build_src_flags =
    -Os
    -fno-rtti
    -fno-exceptions
extra_scripts =
    ; nothing yet — placeholder
    ; FW_VERSION is overridden by CI via env: APP_VERSION_NAME -> -DFW_VERSION="..."
    ; Local builds fall back to the default below.
